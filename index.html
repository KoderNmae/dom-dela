<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Домашние дела</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 4 3 15h3v13h7v-8h6v8h7V15h3z%27 fill=%27%2306b6d4%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style id="appstyle">
:root{
  --ink:#0f2a30; --text:#123138; --muted:#4c6169; --faint:#8399a0;
  --line:rgba(14,60,70,.14); --line-2:rgba(14,60,70,.08);
  --glass:rgba(255,255,255,.56); --glass-2:rgba(255,255,255,.40); --glass-brd:rgba(255,255,255,.72);
  --glass-sh:0 6px 26px rgba(8,54,64,.12), inset 0 1px 0 rgba(255,255,255,.5);
  --field:rgba(255,255,255,.7);
  --cy:#06b6d4; --cy-ink:#0e7490; --cy-soft:rgba(6,182,212,.14);
  --p1:#16a34a; --p1-ink:#0f7a37; --p1-soft:rgba(22,163,74,.15);
  --p2:#ec4899; --p2-ink:#bd2e74; --p2-soft:rgba(236,72,153,.15);
  --warn:#c2710c; --warn-soft:rgba(217,119,6,.15);
  --radius:16px;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-ui:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);font-family:var(--font-ui);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:linear-gradient(165deg,#e4f2f4 0%,#edf7f8 45%,#f2eff6 100%);min-height:100vh}
body::before{content:"";position:fixed;inset:-20% -10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38vw 38vw at 12% 8%, rgba(6,182,212,.34), transparent 60%),
    radial-gradient(34vw 34vw at 88% 12%, rgba(34,211,238,.26), transparent 60%),
    radial-gradient(40vw 40vw at 78% 88%, rgba(236,72,153,.20), transparent 62%),
    radial-gradient(36vw 36vw at 8% 92%, rgba(22,163,74,.20), transparent 62%);
  filter:blur(20px) saturate(1.1)}
#root{max-width:940px;margin:0 auto;padding:22px 16px 72px}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:15px;color:var(--text)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--glass-brd);box-shadow:var(--glass-sh);border-radius:var(--radius)}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  .glass{background:rgba(255,255,255,.86)}
}

/* header */
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 16px;margin-bottom:18px}
.hd .ttl{font-family:var(--font-display);font-weight:600;font-size:31px;letter-spacing:-.01em;line-height:1.05;color:var(--ink)}
.hd .date{color:var(--muted);font-size:15px;font-weight:500;text-transform:capitalize}
.hd .spacer{flex:1 1 40px}
.me{display:inline-flex;padding:3px;gap:2px;border-radius:999px}
.me span{font-size:12px;color:var(--faint);align-self:center;padding:0 8px 0 10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.me button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:6px 13px;border-radius:999px;transition:.12s}
.me button.on{background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(8,54,64,.12)}
.me button.on.p1{color:var(--p1-ink)}
.me button.on.p2{color:var(--p2-ink)}

/* completion cards */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.pcard{padding:15px 17px;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.pcard.you{box-shadow:0 0 0 2px var(--pc), var(--glass-sh)}
.pcard .nm{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.pcard .nm b{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--pc-ink)}
.pcard .youtag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pc-ink);background:var(--pc-soft);padding:2px 8px;border-radius:999px}
.pcard .big{display:flex;align-items:baseline;gap:8px}
.pcard .pct{font-size:35px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--pc-ink)}
.pcard .sub{color:var(--muted);font-size:13px;font-weight:500}
.bar{height:8px;background:rgba(14,60,70,.09);border-radius:999px;margin-top:11px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pc);border-radius:999px;transition:width .35s ease}

/* balance strip */
.balance{padding:14px 17px;margin-bottom:22px}
.balance .bh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:9px}
.balance .bh .t{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.balance .bh .meta{color:var(--faint);font-size:13px;font-weight:500}
.balance .bh .reset{margin-left:auto;border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600}
.split{display:flex;height:26px;border-radius:9px;overflow:hidden;background:rgba(14,60,70,.08);gap:2px}
.split > span{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;min-width:0;transition:flex-basis .35s ease;white-space:nowrap;overflow:hidden}
.split .s1{background:var(--p1)} .split .s2{background:var(--p2);color:#fff}
.split .s0{background:transparent;color:var(--faint);flex:1;font-weight:500}
.balance .legend{color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.45}

/* section head */
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.sec-h h2{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.sec-h .ln{flex:1;height:1px;background:var(--line)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{overflow:hidden}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--pc-soft)}
.col-h b{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--pc-ink)}
.col-h .mini{font-size:12.5px;font-weight:600;color:var(--pc-ink);opacity:.9}
.tasks{list-style:none;margin:0;padding:6px}
.task{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;padding:9px 8px;border-radius:11px;transition:background .12s}
.task + .task{border-top:1px solid var(--line-2)}
.task:hover{background:rgba(255,255,255,.4)}
.ck{flex:0 0 auto;width:25px;height:25px;border-radius:8px;border:2px solid var(--pc);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px;transition:.12s}
.ck svg{width:14px;height:14px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0;transition:.12s}
.task.ok .ck{background:var(--pc);border-color:var(--pc)}
.task.ok .ck svg{opacity:1}
.step{flex:0 0 auto;display:inline-flex;align-items:center;border:1.5px solid var(--pc);border-radius:9px;overflow:hidden;margin-top:0}
.step button{border:0;background:transparent;color:var(--pc-ink);width:24px;height:26px;font-size:15px;font-weight:700;padding:0;line-height:1}
.step .n{font-size:12px;font-weight:700;color:var(--pc-ink);min-width:30px;text-align:center;padding:0 2px}
.step.full{background:var(--pc)}
.step.full button,.step.full .n{color:#fff}
.step.ro{padding:2px 9px;cursor:default}
.stepone{flex:0 0 auto;min-width:40px;height:27px;border:1.8px solid var(--pc);border-radius:9px;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;margin-top:0;transition:.12s}
.stepone .n{font-size:12.5px;font-weight:700;color:var(--pc-ink)}
.stepone.full{background:var(--pc);border-color:var(--pc)}
.stepone svg{width:15px;height:15px;stroke:#fff;stroke-width:3.2;fill:none}
.stepone:active{transform:scale(.94)}
.step.ro svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none}
.step.ro.full svg{stroke:#fff}
.step.ro.lock{border-color:var(--faint);border-style:dashed;opacity:.75}
.step.ro.lock .n{color:var(--muted)}
.tbody{flex:1;min-width:0}
.tt{font-weight:600;font-size:15px;line-height:1.25;word-break:break-word}
.task.ok .tt,.task.skip .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.why{color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px;opacity:.85}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
.chip{font-size:11.5px;font-weight:600;color:var(--muted);background:rgba(14,60,70,.06);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px}
.chip.eff{color:var(--pc-ink);background:var(--pc-soft);border-color:transparent}
.chip.rep{color:var(--cy-ink);background:var(--cy-soft);border-color:transparent}
.chip.skipped{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.cover{color:var(--cy-ink);background:var(--cy-soft);border-color:transparent}
.reps{display:inline-flex;align-items:center;border:1px solid var(--cy);background:var(--cy-soft);border-radius:7px;overflow:hidden}
.reps .rb{border:0;background:transparent;color:var(--cy-ink);width:22px;height:22px;font-size:15px;font-weight:700;padding:0;line-height:1}
.reps .rb:active{background:rgba(6,182,212,.2)}
.reps .rn{font-size:11.5px;font-weight:700;color:var(--cy-ink);padding:0 5px;white-space:nowrap}
.acts{flex-basis:100%;order:9;display:flex;flex-flow:row wrap;gap:6px;margin:5px 0 1px 35px}
.ck.ro{cursor:default}
.ck.ro.skip{border-color:var(--warn)}
.ch-l{display:flex;align-items:center;gap:8px;min-width:0}
.ro-tag{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);background:rgba(14,60,70,.07);padding:2px 7px;border-radius:999px;white-space:nowrap}
.col.ro-col{opacity:.98}
.snoozed{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:2px 6px 0;padding:9px 13px;border:1px dashed var(--cy);background:var(--cy-soft);border-radius:12px}
.sz-lb{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--cy-ink)}
.sz-lb svg{width:14px;height:14px}
.sz-item{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--text);background:rgba(255,255,255,.65);border-radius:8px;padding:3px 5px 3px 10px}
.mini-btn{border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:8px;height:28px;min-width:30px;padding:0 7px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;justify-content:center;transition:.12s;white-space:nowrap}
.mini-btn:hover{color:var(--text);border-color:var(--faint)}
.mini-btn svg{width:13px;height:13px}
.mini-btn.skip:hover{color:var(--warn);border-color:var(--warn)}
.mini-btn.restore{color:var(--cy-ink);border-color:var(--cy)}
.empty{padding:22px 14px;text-align:center;color:var(--faint);font-size:14px;font-weight:500}
.dstat{flex:0 0 auto;width:25px;height:25px;border-radius:8px;border:2px solid var(--warn);color:var(--warn);background:var(--warn-soft);display:grid;place-items:center;font-weight:800;font-size:15px;line-height:1;margin-top:1px}
/* carryover pool */
.pool{padding:14px 16px}
.pool-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:6px}
.pool-t{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.02em;text-transform:uppercase;color:var(--warn)}
.pool-cnt{color:var(--faint);font-size:13px;font-weight:600;margin-left:auto}
.pool-note{color:var(--muted);font-size:12.5px;line-height:1.45;margin-bottom:11px}
.grace-note{display:flex;gap:8px;align-items:flex-start;font-size:12.8px;line-height:1.45;color:var(--cy-ink);background:var(--cy-soft);border-radius:12px;padding:10px 13px;margin-bottom:12px}
.grace-note svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
.pool-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pool-empty{color:var(--muted);font-size:13px;line-height:1.5;text-align:center;padding:8px 6px}
.pool-item{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border:1px solid var(--line-2);border-left:3px solid var(--warn);border-radius:11px;background:var(--warn-soft)}
.pi-body{flex:1;min-width:160px}
.pi-tt{font-weight:600;font-size:14.5px;line-height:1.25;word-break:break-word}
.pi-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
.pi-meta .chip{background:rgba(255,255,255,.6)}
.pi-meta .chip.when{color:var(--warn);font-weight:700;border-color:transparent}
.pi-meta .chip.eff{color:var(--pc-ink);background:var(--pc-soft);border-color:transparent}
.pi-meta .chip.who{color:var(--pc-ink);background:var(--pc-soft);border-color:transparent}
.pi-meta .chip.claim{color:var(--pc-ink);background:#fff;border-color:var(--pc)}
.pi-acts{display:flex;flex-flow:row wrap;gap:6px}
.pool-item .mini-btn{background:rgba(255,255,255,.78)}
.mini-btn.done-btn{color:var(--cy-ink);border-color:var(--cy);font-weight:700}
.mini-btn.done-btn:hover{background:var(--cy-soft)}
.task.disp{background:rgba(217,119,6,.06)}
.chip.disp{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.disagree{color:#fff;background:var(--warn);border-color:transparent}
.mini-btn.warn-btn{color:var(--warn);border-color:var(--warn)}
.disp-form{align-items:center}
.disp-input{flex:1 1 140px;min-width:90px;height:28px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font-size:12.5px;font-family:inherit;background:var(--field);color:var(--text)}
.disp-input:focus{outline:none;border-color:var(--cy)}
.task.pending .tt{color:var(--muted)}
.pstat{flex:0 0 auto;width:25px;height:25px;border-radius:8px;border:1.5px dashed var(--faint);color:var(--muted);display:grid;place-items:center;margin-top:1px}
.pstat svg{width:13px;height:13px}
.chip.pend{color:var(--muted);background:transparent;border:1px dashed var(--faint)}
.calitem.pend{opacity:.72}
.calitem.pend .cd{color:var(--muted)}
/* compact chore rows */
.chsearch{margin:8px 0 4px}
.chsearch input{width:100%;height:40px;border:1px solid var(--line);border-radius:11px;padding:0 14px;font-size:15px;font-family:inherit;background:var(--field);color:var(--text)}
.chsearch input:focus{outline:none;border-color:var(--cy)}
.mrow{border:1px solid var(--line-2);border-radius:12px;margin-top:8px;overflow:hidden;background:var(--field)}
.mrow.open{border-color:var(--cy)}
.mrc{display:grid;grid-template-columns:1fr auto;gap:6px 10px;width:100%;text-align:left;padding:12px 14px;background:transparent;border:0}
.mrc-t{grid-column:1;grid-row:1;font-weight:600;font-size:15px;line-height:1.25;color:var(--text);min-width:0}
.mrc-s{grid-column:1;grid-row:2;display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.mrc-when{font-size:11.5px;font-weight:600;color:var(--muted)}
.mrc-chev{grid-column:2;grid-row:1 / span 2;align-self:center;color:var(--faint);display:flex;transition:.15s}
.mrow.open .mrc-chev{transform:rotate(90deg)}
.m-edit{padding:4px 14px 14px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px}
.m-edit .fl{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);margin-top:10px}
.m-edit input,.m-edit select.m-sel{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--text);margin:0;width:100%;box-sizing:border-box}
.m-edit input.m-num{width:76px}
.m-edit input.m-n{width:66px}
.m-edit input:focus,.m-edit select:focus{outline:none;border-color:var(--cy)}
.m-edit .m-line{display:flex;align-items:center;gap:8px;margin-top:2px}
.m-edit .m-line.wrap{flex-wrap:wrap}
.m-edit .m-num{width:76px}
.m-edit .m-n{width:66px}
.m-edit .m-sel{width:100%}
.m-edit .pts{display:inline-flex;flex-wrap:wrap;gap:5px}
.m-edit .pts button{min-width:42px;height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);font-weight:700;font-size:14px}
.m-edit .pts button.on{background:var(--cy);border-color:var(--cy);color:#fff}
.m-edit .dow{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.m-edit .dow button{min-width:44px;height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);font-weight:600;font-size:13px}
.m-edit .dow button.on{background:var(--pc,#06b6d4);border-color:var(--pc,#06b6d4);color:#fff}
.m-edit .cyc{display:inline-flex;flex-wrap:wrap;gap:5px}
.m-edit .cyc .cycb{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-weight:600;font-size:12.5px}
.m-edit .cyc .cycb.on{background:var(--cy);border-color:var(--cy);color:#fff}
.m-edit .effword{font-size:13px;font-weight:600;color:var(--muted)}
.m-edit-foot{margin-top:14px}
.m-edit .del{height:38px;padding:0 16px;border:1px solid var(--warn);border-radius:10px;background:transparent;color:var(--warn);font-weight:600;font-size:13.5px}
/* analytics headline */
.an-big{display:flex;align-items:baseline;gap:2px;margin-top:6px}
.an-pct{font-size:40px;font-weight:800;letter-spacing:-.02em;color:var(--pc-ink);line-height:1}
.an-pctu{font-size:20px;font-weight:700;color:var(--pc-ink)}
.an-cap{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.an-sub{font-size:13.5px;color:var(--text);margin-top:9px}
.an-explain{font-size:12.5px;line-height:1.45;color:var(--muted);margin:10px 2px 2px}
.an-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:42px;margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text);font-weight:600;font-size:14px}
.an-more .car{transition:.15s}
.an-details{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.offnote{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--cy-ink);background:var(--cy-soft);border-radius:10px;padding:8px 12px;margin:2px 0 10px}
.offbox{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:10px}
.offname{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--pc-ink);margin-bottom:4px}
.offline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.offdays{display:inline-flex;flex-wrap:wrap;gap:4px}
.offdays button{border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:8px;min-width:36px;height:30px;padding:0 8px;font-size:12.5px;font-weight:600;transition:.12s}
.offdays button.on{background:var(--pc);border-color:var(--pc);color:#fff}
.offdays button.offclear.on{background:var(--field);border-color:var(--faint);color:var(--text)}
.offd{max-width:150px}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.awaylist{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

.cal{display:flex;flex-direction:column;gap:10px}

function loadState(){ try{ return normalize(JSON.parse(document.getElementById("state").textContent)); }catch(e){ return normalize({}); } }
function normalize(s){
  s=s||{};
  if(!s.people) s.people=[{id:"p1",name:"Егор"},{id:"p2",name:"Маша"}];
  if(!s.chores) s.chores=[];
  if(!s.mode) s.mode="balanced";
  if(!s.overrides) s.overrides={};
  if(!s.done) s.done={};
  if(!s.skip) s.skip={};
  if(!s.capacity) s.capacity={p1:50};
  if(!s.moved) s.moved={};
  if(!s.extra) s.extra={};
  if(!s.dispute) s.dispute={};
  if(!s.debt) s.debt={};
  if(!s.frozen) s.frozen={};
  if(!s.restDay) s.restDay={};
  if(!s.away) s.away={};
  ["p1","p2"].forEach(function(pid){ if(s.away[pid]&&!Array.isArray(s.away[pid])) s.away[pid]=Object.keys(s.away[pid]).map(function(k){return s.away[pid][k];}); });
  if(s.chores && !Array.isArray(s.chores)) s.chores=Object.keys(s.chores).map(function(k){return s.chores[k];});
  if(s.people && !Array.isArray(s.people)) s.people=Object.keys(s.people).map(function(k){return s.people[k];});
  s.chores.forEach(function(c){ if(!c.freq)c.freq={t:"daily"}; if(typeof c.points!=="number")c.points=1; if(!c.perDay||c.perDay<1)c.perDay=1; if(c.why==null)c.why=""; if(c.freq&&c.freq.d&&!Array.isArray(c.freq.d)) c.freq.d=Object.keys(c.freq.d).map(function(k){return +c.freq.d[k];}); });
  return s;
}

/* ---------- date helpers ---------- */
function pad(n){ return n<10?"0"+n:""+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function parseYMD(s){ var p=String(s).split("-"); return new Date(+p[0],(+p[1])-1,+p[2]); }
function dayIndex(s){ return Math.floor(parseYMD(s).getTime()/86400000); }
function fmtDate(s){ var d=parseYMD(s); return WD_FULL[d.getDay()]+", "+d.getDate()+" "+MONTHS[d.getMonth()]; }
function addDays(s,n){ return ymd(new Date(parseYMD(s).getTime()+n*86400000)); }
function mondayOf(s){ var d=parseYMD(s),wd=d.getDay(),diff=(wd===0?-6:1-wd); return addDays(s,diff); }
function weekDates(off){ var start=addDays(mondayOf(todayStr()),off*7),a=[]; for(var i=0;i<7;i++)a.push(addDays(start,i)); return a; }
function lastNDays(n){ var t=todayStr(),a=[]; for(var i=n-1;i>=0;i--)a.push(addDays(t,-i)); return a; }
function graceDay(){ return (new Date().getHours()<12) ? addDays(todayStr(),-1) : null; } /* до полудня вчерашний день ещё редактируется */

/* ---------- effort ---------- */
function effortOf(c){ return (c.points||0)*(c.perDay||1); }
function isReactive(c){ return !!(c.after&&c.after.on); }
var _rvDepth=0;
/* Связанное («после …») дело:
   - знаменатель «/N» зеркалит план триггера (поставить 2× ⇒ разобрать 2×) — симметрично;
   - но ОТМЕТИТЬ можно лишь столько, сколько триггер реально сделан (owedOf) — нельзя разобрать
     раньше, чем поставил;
   - дело с ЗАДЕРЖКОЙ (снять +Nд) появляется только когда реально «пришло» (owed>0), не заранее. */
function trigScheduled(c,s){
  if(_rvDepth>6) return false;
  var d=Math.max(0,Math.round(c.after.delayDays||0)),T=getChore(c.after.on);
  if(!T) return false;
  _rvDepth++; var r=occursOn(T,addDays(s,-d)); _rvDepth--;
  return r;
}
function owedOf(c,s){
  if(!isReactive(c)) return 0;
  var W=45,d=Math.max(0,Math.round(c.after.delayDays||0)),T=c.after.on,tot=0,dep=0,k;
  for(k=d;k<=W;k++) tot+=unitsOf(addDays(s,-k),T);
  for(k=1;k<=W;k++) dep+=unitsOf(addDays(s,-k),c.id);
  var tg=tot-dep; return tg>0?tg:0;
}
function targetOf(c,s){
  if(!isReactive(c)) return c.perDay||1;
  var owed=owedOf(c,s);
  var planned=(Math.round(c.after.delayDays||0)>0)?0:(trigScheduled(c,s)?(((getChore(c.after.on)||{}).perDay)||1):0);
  return Math.max(planned,owed);
}
function isPending(c,s){ return isReactive(c)&&owedOf(c,s)===0&&targetOf(c,s)>0; } /* виден, но пока залочен */
function maxUnits(c,s){ return isReactive(c)?owedOf(c,s):(c.perDay||1); }
function effortAt(c,s){ return (c.points||0)*targetOf(c,s); }
function byEffDescOn(s){ return function(a,b){ return (effortAt(b,s)-effortAt(a,s))||(a.id<b.id?-1:1); }; }
function depLabel(c){ var t=getChore(c.after.on),nm=t?t.title:'?',dd=Math.round(c.after.delayDays||0); return 'после: '+nm+(dd>0?' +'+dd+'д':''); }
function fmtPts(v){ return (Math.round(v*100)/100).toString(); }
function effWord(v){ if(v<=0.5)return"мелочь"; if(v<=1)return"минимум"; if(v<=2)return"лёгкое"; if(v<=3)return"среднее"; if(v<=5)return"тяжёлое"; return"очень тяжёлое"; }

/* ---------- distribution (pure) ---------- */
function isDue(c,s){
  var f=c.freq||{t:"daily"};
  if(f.t==="daily")return true;
  if(f.t==="dow")return (f.d||[]).indexOf(parseYMD(s).getDay())>=0;
  if(f.t==="everyN"){ var n=f.n||1; if(n<1)n=1; var a=f.anchor?dayIndex(f.anchor):0; var diff=dayIndex(s)-a; return diff>=0&&(diff%n)===0; }
  if(f.t==="once")return f.date===s;
  return true;
}
function occursOn(c,s){ if(isReactive(c)) return targetOf(c,s)>0; if(state.extra[s]&&state.extra[s][c.id])return true; if(state.moved[s]&&state.moved[s][c.id])return false; return isDue(c,s); }
function byEffDesc(a,b){ return (effortOf(b)-effortOf(a))||(a.id<b.id?-1:1); }
function shares(){ var p1=(state.capacity&&typeof state.capacity.p1==="number")?state.capacity.p1:50; p1=Math.max(0,Math.min(100,p1)); return {p1:p1/100,p2:(100-p1)/100}; }
function balanceInto(list,assign,di,totals,s){
  var w=shares(),e1=Math.max(w.p1,1e-6),e2=Math.max(w.p2,1e-6),prim=(di%2===0)?["p1","p2"]:["p2","p1"];
  list.forEach(function(c){ var r1=totals.p1/e1,r2=totals.p2/e2,t; if(Math.abs(r1-r2)<1e-9)t=prim[0]; else t=(r1<r2)?"p1":"p2"; assign[c.id]=t; totals[t]+=effortAt(c,s); });
}
function isOff(pid,s){
  var rd=state.restDay&&state.restDay[pid];
  if(rd!=null&&parseYMD(s).getDay()===rd)return true;
  var aw=state.away&&state.away[pid];
  if(aw){ for(var i=0;i<aw.length;i++){ if(aw[i]&&s>=aw[i].from&&s<=aw[i].to)return true; } }
  return false;
}
function offInfo(pid,s){
  var rd=state.restDay&&state.restDay[pid];
  if(rd!=null&&parseYMD(s).getDay()===rd)return "отдых";
  var aw=state.away&&state.away[pid];
  if(aw){ for(var i=0;i<aw.length;i++){ if(aw[i]&&s>=aw[i].from&&s<=aw[i].to)return "отъезд"; } }
  return null;
}
/* pid тянет день в одиночку, потому что второй сегодня «не выполняет» (отдых/отъезд) —
   в такой день отмена дела не считается штрафом для того, кто на подмене. */
function coveringDay(pid,s){ return isOff(pid==="p1"?"p2":"p1",s); }
function autoAssign(s,due){
  var assign={},di=dayIndex(s),cmp=byEffDescOn(s);
  var off1=isOff("p1",s),off2=isOff("p2",s);
  if(off1&&!off2){ due.forEach(function(c){ assign[c.id]="p2"; }); }
  else if(off2&&!off1){ due.forEach(function(c){ assign[c.id]="p1"; }); }
  else if(state.mode==="fixed"){
    var rest=[],totals={p1:0,p2:0};
    due.forEach(function(c){ if(c.owner==="p1"||c.owner==="p2"){assign[c.id]=c.owner;totals[c.owner]+=effortAt(c,s);} else rest.push(c); });
    balanceInto(rest.sort(cmp),assign,di,totals,s);
  } else if(state.mode==="rotate"){
    due.slice().sort(cmp).forEach(function(c,i){ assign[c.id]=(((i+di)%2)===0)?"p1":"p2"; });
  } else {
    balanceInto(due.slice().sort(cmp),assign,di,{p1:0,p2:0},s);
  }
  for(var fp=0;fp<3;fp++){ due.forEach(function(c){ if(isReactive(c)&&targetOf(c,s)===0){ var tg=c.after&&c.after.on; if(tg&&assign[tg]&&assign[c.id]!==assign[tg])assign[c.id]=assign[tg]; } }); }
  return assign;
}
function computeAssignments(s){
  var fz=state.frozen&&state.frozen[s], fzKeys=fz?Object.keys(fz):[];
  var due;
  if(fz&&fzKeys.length){
    /* замороженный день: СОСТАВ дел тоже зафиксирован (ключи fz = что было в этот день на момент
       заморозки), меняется только правками того же дня — перенос «на завтра» / разовое добавление.
       Так смена расписания/конфига (напр. перенос дела с субботы) не переписывает задним числом
       уже начатый день: заморозка держит и КТО делает, и КАКИЕ дела в этот день были. */
    due=state.chores.filter(function(c){
      if(state.moved[s]&&state.moved[s][c.id])return false;
      if(state.extra[s]&&state.extra[s][c.id])return true;
      return fz[c.id]!=null;
    });
  } else {
    due=state.chores.filter(function(c){ return occursOn(c,s); });
  }
  var assign=autoAssign(s,due);
  if(fz){ due.forEach(function(c){ if(fz[c.id]!=null)assign[c.id]=fz[c.id]; }); }
  var ov=state.overrides[s];                      /* ручная передача — поверх всего */
  if(ov){ due.forEach(function(c){ if(ov[c.id])assign[c.id]=ov[c.id]; }); }
  return {due:due,assign:assign};
}
/* freeze a day's auto-layout the first time it gets activity, so later effort/config
   changes only move FUTURE days and never a board the couple is already filling. */
function freezeDay(s){ if(!state.frozen)state.frozen={}; if(state.frozen[s])return false; var due=state.chores.filter(function(c){ return occursOn(c,s); }); if(!due.length)return false; state.frozen[s]=autoAssign(s,due); return true; }
function dayHasActivity(s){
  var src=[state.done,state.skip,state.overrides,state.moved,state.dispute,state.debt],i;
  for(i=0;i<src.length;i++){ if(src[i]&&src[i][s]&&Object.keys(src[i][s]).length)return true; }
  return false;
}
function migrateFreeze(){
  var chg=false,seen={},src=[state.done,state.skip,state.overrides,state.moved,state.dispute,state.debt],i,k;
  for(i=0;i<src.length;i++){ for(k in src[i]){ if(seen[k])continue; seen[k]=1; if(!(state.frozen&&state.frozen[k])&&dayHasActivity(k)){ if(freezeDay(k))chg=true; } } }
  return chg;
}
function unitsOf(s,cid){ var d=state.done[s]; return d&&d[cid]?d[cid]:0; }
function isSkipped(s,cid){ var k=state.skip[s]; return k&&k[cid]; }
/* ---------- carryover pool (хвосты) ---------- */
function firstActivityDate(){ var best=null,src=[state.done,state.skip,state.debt],i,k; for(i=0;i<src.length;i++){ for(k in src[i]){ if(best===null||k<best)best=k; } } return best; }
function debtOf(d,cid){ var x=state.debt[d]; return x&&x[cid]?x[cid]:null; }
function isTail(c,d){
  if(isReactive(c))return false;            /* реактивные считаются сами (зеркалят триггер) */
  if(unitsOf(d,c.id)>0)return false;        /* только полностью не тронутые */
  if(isSkipped(d,c.id))return false;        /* уже сняли «не буду» */
  if(state.dispute[d]&&state.dispute[d][c.id])return false; /* в споре — свой поток */
  return occursOn(c,d);
}
function poolTails(){
  var today=todayStr(),fa=firstActivityDate(); if(!fa)return [];
  var faI=dayIndex(fa),out=[],k,d,comp,gd=graceDay();
  for(k=1;k<=7;k++){
    d=addDays(today,-k);
    if(dayIndex(d)<faI)break;
    if(gd&&d===gd)continue;               /* до первого дня учёта долгов нет */
    comp=computeAssignments(d);
    comp.due.forEach(function(c){
      if(!isTail(c,d))return;
      var db=debtOf(d,c.id); if(db&&(db.st==="done"||db.st==="skip"))return; /* уже разрешён */
      out.push({c:c,d:d,who:comp.assign[c.id],claim:(db&&db.st==="claim")?db.by:null,eff:effortAt(c,d)});
    });
  }
  out.sort(function(a,b){ return dayIndex(a.d)-dayIndex(b.d) || (b.eff-a.eff) || (a.c.id<b.c.id?-1:1); });
  return out;
}
function poolDayLabel(d){ var t=todayStr(); if(d===addDays(t,-1))return"вчера"; if(d===addDays(t,-2))return"позавчера"; var dt=parseYMD(d); return WD[dt.getDay()]+", "+dt.getDate()+" "+MONTHS_SH[dt.getMonth()]; }
function dayTotals(comp,s){
  var t={p1:0,p2:0,skip1:0,skip2:0};
  comp.due.forEach(function(c){ var pid=comp.assign[c.id],e=effortAt(c,s); if(isSkipped(s,c.id)){ if(coveringDay(pid,s))return; t[pid==="p1"?"skip1":"skip2"]+=e; } else { t[pid]+=e; } });
  t.total=t.p1+t.p2; return t;
}
function loadPct(comp,s){ var t=dayTotals(comp,s); if(!t.total)return{p1:50,p2:50,t:t}; var a=Math.round(t.p1/t.total*100); return{p1:a,p2:100-a,t:t}; }
function progress(pid,s,comp){
  var tot=0,dn=0,cnt=0,cdone=0;
  comp.due.forEach(function(c){ if(comp.assign[c.id]!==pid||isSkipped(s,c.id)||isPending(c,s))return; var tg=targetOf(c,s),e=(c.points||0)*tg,u=Math.min(tg,unitsOf(s,c.id)); tot+=e; dn+=(c.points||0)*u; cnt++; if(u>=tg)cdone++; });
  return {tot:tot,done:dn,pct:tot?Math.round(dn/tot*100):100,empty:cnt===0,remaining:tot-dn,count:cnt,countDone:cdone};
}
function tasksFor(pid,comp,s){
  var arr=comp.due.filter(function(c){ return comp.assign[c.id]===pid; });
  function _rk(c){ if(isPending(c,s))return 1; return (unitsOf(s,c.id)>=targetOf(c,s)||isSkipped(s,c.id))?2:0; }
  arr.sort(function(a,b){ return _rk(a)-_rk(b)||byEffDescOn(s)(a,b); });
  return arr;
}

/* ---------- analytics ---------- */
function analytics(days){
  var per={p1:blank(),p2:blank()}, cat={p1:{},p2:{}}, trend=[];
  days.forEach(function(s){
    var comp=computeAssignments(s), dp={p1:null,p2:null};
    ["p1","p2"].forEach(function(pid){
      var A=0,D=0,S=0,active=0;
      comp.due.forEach(function(c){ if(comp.assign[c.id]!==pid)return; var e=effortAt(c,s);
        if(isSkipped(s,c.id)){ if(coveringDay(pid,s))return; A+=e; S+=e; return; }  /* подмена: отмена без штрафа */
        A+=e;
        active+=e; var u=Math.min(targetOf(c,s),unitsOf(s,c.id)), de=(c.points||0)*u; D+=de;
        if(de>0){ var k=c.cat||"Прочее"; cat[pid][k]=(cat[pid][k]||0)+de; }
      });
      var p=per[pid]; p.assigned+=A; p.done+=D; p.skipped+=S; p.kept+=(A-S);
      if(state.dispute[s]){ comp.due.forEach(function(c){ if(comp.assign[c.id]===pid&&state.dispute[s][c.id])p.disputed++; }); }
      if(isOff(pid,s))p.offdays++;
      dp[pid]=active>0?Math.round(D/active*100):null;
    });
    trend.push({s:s,p1:dp.p1,p2:dp.p2});
  });
  days.forEach(function(s){
    var db=state.debt[s]; if(!db)return;
    for(var cid in db){ var r=db[cid],c=getChore(cid); if(!c||!r||isReactive(c))continue; var eff=effortAt(c,s);
      if(r.st==="done"&&per[r.by]) per[r.by].pooldone+=eff;
      else if(r.st==="skip"&&per[r.by]){ if(!coveringDay(r.by,s)) per[r.by].poolskip+=eff; }
    }
  });
  ["p1","p2"].forEach(function(pid){ var p=per[pid];
    p.vypoln=p.assigned>0?Math.round(p.done/p.assigned*100):null;
    p.effic=p.kept>0?Math.round(p.done/p.kept*100):null;
    p.streak=streakOf(pid);
  });
  return {per:per,cat:cat,trend:trend};
}
function blank(){ return {assigned:0,done:0,skipped:0,kept:0,disputed:0,offdays:0,pooldone:0,poolskip:0}; }
function streakOf(pid){
  var n=0,s=todayStr(),guard=0;
  while(guard++<400){
    var comp=computeAssignments(s),active=0,D=0;
    comp.due.forEach(function(c){ if(comp.assign[c.id]!==pid||isSkipped(s,c.id))return; active+=effortAt(c,s); D+=(c.points||0)*Math.min(targetOf(c,s),unitsOf(s,c.id)); });
    if(active===0){ s=addDays(s,-1); continue; }
    if(D>=active-1e-9){ n++; s=addDays(s,-1); } else break;
    if(dayIndex(s)<dayIndex(state.chores.length?"2020-01-01":todayStr()))break;
  }
  return n;
}

/* ---------- ops ---------- */
function getChore(id){ for(var i=0;i<state.chores.length;i++)if(state.chores[i].id===id)return state.chores[i]; return null; }
function getPerson(id){ for(var i=0;i<state.people.length;i++)if(state.people[i].id===id)return state.people[i]; return null; }
function applyOp(o){
  var s=o.s,c;
  if(o.s&&(o.t==="units"||o.t==="toggle"||o.t==="skip"||o.t==="snooze"||o.t==="dispute"||o.t==="dispute-disagree"||o.t==="dispute-resolve"||o.t==="debt-done"||o.t==="debt-claim"||o.t==="debt-skip"||o.t==="assign")) freezeDay(o.s);
  if(o.t==="units"||o.t==="toggle"){ var v=(o.t==="toggle")?(o.val?1:0):o.val; if(!state.done[s])state.done[s]={}; if(v>0)state.done[s][o.cid]=v; else delete state.done[s][o.cid]; if(v>0&&state.skip[s])delete state.skip[s][o.cid]; }
  else if(o.t==="skip"){ if(o.on){ if(!state.skip[s])state.skip[s]={}; state.skip[s][o.cid]=o.pid; if(state.done[s])delete state.done[s][o.cid]; } else { if(state.skip[s])delete state.skip[s][o.cid]; } }
  else if(o.t==="assign"){ if(!state.overrides[s])state.overrides[s]={}; state.overrides[s][o.cid]=o.to; }
  else if(o.t==="reset-ov"){ delete state.overrides[s]; }
  else if(o.t==="snooze"){ var nd=addDays(s,1); if(!state.moved[s])state.moved[s]={}; state.moved[s][o.cid]=1; if(!state.extra[nd])state.extra[nd]={}; state.extra[nd][o.cid]=1; if(state.done[s])delete state.done[s][o.cid]; if(state.skip[s])delete state.skip[s][o.cid]; }
  else if(o.t==="unsnooze"){ var un=addDays(s,1); if(state.moved[s]){ delete state.moved[s][o.cid]; if(!Object.keys(state.moved[s]).length)delete state.moved[s]; } if(state.extra[un]){ delete state.extra[un][o.cid]; if(!Object.keys(state.extra[un]).length)delete state.extra[un]; } }

  else if(o.t==="debt-done"){ if(!state.debt[s])state.debt[s]={}; state.debt[s][o.cid]={st:"done",by:o.by}; }
  else if(o.t==="debt-claim"){ if(!state.debt[s])state.debt[s]={}; state.debt[s][o.cid]={st:"claim",by:o.by}; }
  else if(o.t==="debt-release"){ if(state.debt[s]){ delete state.debt[s][o.cid]; if(!Object.keys(state.debt[s]).length)delete state.debt[s]; } }
  else if(o.t==="debt-skip"){ if(!state.debt[s])state.debt[s]={}; state.debt[s][o.cid]={st:"skip",by:o.by}; }
  else if(o.t==="restday"){ if(!state.restDay)state.restDay={}; var rnd=(o.d<0)?null:o.d; state.restDay[o.pid]=(state.restDay[o.pid]===rnd)?null:rnd; }
  else if(o.t==="away-add"){ if(!state.away)state.away={}; if(!state.away[o.pid])state.away[o.pid]=[]; state.away[o.pid].push({from:o.from,to:o.to}); }
  else if(o.t==="away-del"){ if(state.away&&state.away[o.pid])state.away[o.pid].splice(o.idx,1); }

function kpi(label,val,hl){ return '<div class="kpi'+(hl?' hl':'')+'"><div class="kl">'+label+'</div><div class="kv tnum">'+val+'</div></div>'; }

function trendSVG(trend){
  var W=680,H=150,pl=34,pr=26,pt=12,pb=22,pw=W-pl-pr,ph=H-pt-pb,n=trend.length;
  function X(i){ return pl+(n<=1?pw/2:i*pw/(n-1)); }
  function Y(v){ return pt+(1-v/100)*ph; }
  var g='';
  [0,25,50,75,100].forEach(function(v){ var y=Y(v); g+='<line class="grid" x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'"/>'; g+='<text class="tick" x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">'+v+'</text>'; });
  var step=Math.max(1,Math.ceil(n/7));
  for(var i=0;i<n;i++){ if(i%step===0||i===n-1){ var d=parseYMD(trend[i].s); g+='<text class="tick" x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+d.getDate()+"."+pad(d.getMonth()+1)+'</text>'; } }
  function series(key,color){
    var path="",dots="",started=false;
    for(var i=0;i<n;i++){ var v=trend[i][key]; if(v==null)continue; var x=X(i),y=Y(v); path+=(started?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" "; started=true;
      dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.4" fill="'+color+'"><title>'+esc(fmtDate(trend[i].s))+": "+v+'%</title></circle>'; }
    return path?('<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots):dots;
  }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Выполнение по дням">';
  svg+='<line class="axis" x1="'+pl+'" y1="'+(pt+ph)+'" x2="'+(W-pr)+'" y2="'+(pt+ph)+'"/>';
  svg+=g+series("p1","var(--p1)")+series("p2","var(--p2)");
  /* line names are shown in the legend above the chart */
  return svg+'</svg>';
}
function catCard(pid,catObj){
  var arr=[]; for(var k in catObj)arr.push([k,catObj[k]]); arr.sort(function(a,b){return b[1]-a[1];});
  var max=arr.length?arr[0][1]:1;
  var h='<div class="chartcard glass '+pid+'" style="'+pcVars(pid)+'"><div class="cl">'+esc(getPerson(pid).name)+' — по разделам</div><div class="catlist">';
  if(!arr.length)h+='<div class="cempty" style="color:var(--faint);font-size:13px">пока нет выполненных дел</div>';
  else arr.slice(0,6).forEach(function(e){ h+='<div class="cr"><span class="cnm">'+esc(e[0])+'</span><span class="cb"><i style="width:'+Math.round(e[1]/max*100)+'%"></i></span><span class="cvv tnum">'+fmtPts(e[1])+'</span></div>'; });
  return h+'</div></div>';
}

function statusText(){ return {idle:"",saving:"Сохранение…",saved:"Синхронизировано",offline:"Оффлайн — сохранится, когда появится связь",local:"Локально на этом устройстве (Firebase не настроен)",error:"Ошибка сохранения, повтор…"}[statusName]||""; }
function setStatus(n){ statusName=n; var el=document.getElementById("st"); if(el){ el.className="st "+n; el.innerHTML='<span class="dot"></span>'+statusText(); } }

/* ---------- events ---------- */
root.addEventListener("click",function(e){
  var t=e.target.closest("[data-action]"); if(!t)return;
  var a=t.getAttribute("data-action"),cid=t.getAttribute("data-cid"),date=t.getAttribute("data-date")||todayStr();
  if(a==="me"){ ui.me=t.getAttribute("data-pid"); saveUI(); render(); return; }
  if(a==="units"){ commit({t:"units",s:date,cid:cid,val:+t.getAttribute("data-val")}); return; }
  if(a==="inc"){ var c=getChore(cid),mx=maxUnits(c,date); commit({t:"units",s:date,cid:cid,val:Math.min(mx,unitsOf(date,cid)+1)}); return; }
  if(a==="cycle"){ var cc=getChore(cid),mc=maxUnits(cc,date),cur=unitsOf(date,cid),nx=(cur+1>mc)?0:cur+1; commit({t:"units",s:date,cid:cid,val:nx}); return; }
  if(a==="dec"){ var pdd=(getChore(cid).perDay||1); commit({t:"units",s:date,cid:cid,val:Math.max(0,Math.min(pdd,unitsOf(date,cid))-1)}); return; }
  if(a==="reps-inc"){ var ci=getChore(cid); commit({t:"edit",id:cid,patch:{perDay:Math.min(12,(ci.perDay||1)+1)}}); return; }
  if(a==="reps-dec"){ var cd=getChore(cid); commit({t:"edit",id:cid,patch:{perDay:Math.max(1,(cd.perDay||1)-1)}}); return; }
  if(a==="skip"){ commit({t:"skip",s:date,cid:cid,pid:t.getAttribute("data-pid"),on:true}); return; }
  if(a==="unskip"){ commit({t:"skip",s:date,cid:cid,on:false}); return; }
  if(a==="swap"){ commit({t:"assign",s:date,cid:cid,to:t.getAttribute("data-to")}); return; }
  if(a==="snooze"){ commit({t:"snooze",s:date,cid:cid}); return; }
  if(a==="unsnooze"){ commit({t:"unsnooze",s:date,cid:cid}); return; }
  if(a==="disp-open"){ ui.disputing=date+"|"+cid; render(); setTimeout(function(){ var el=document.getElementById("disputeinput"); if(el)el.focus(); },0); return; }
  if(a==="disp-cancelform"){ ui.disputing=null; render(); return; }
  if(a==="disp-confirm"){ var di=document.getElementById("disputeinput"); var rs=di?di.value.trim().slice(0,80):""; ui.disputing=null; commit({t:"dispute",s:date,cid:cid,by:t.getAttribute("data-by")||ui.me,reason:rs}); return; }
  if(a==="disp-redo"){ ui.disputing=null; commit({t:"dispute-resolve",s:date,cid:cid}); return; }
  if(a==="disp-disagree"){ ui.disputing=null; commit({t:"dispute-disagree",s:date,cid:cid}); return; }
  if(a==="disp-resolve"){ ui.disputing=null; commit({t:"dispute-resolve",s:date,cid:cid}); return; }
  if(a==="debt-done"){ commit({t:"debt-done",s:date,cid:cid,by:ui.me}); return; }
  if(a==="debt-claim"){ commit({t:"debt-claim",s:date,cid:cid,by:ui.me}); return; }
  if(a==="debt-release"){ commit({t:"debt-release",s:date,cid:cid}); return; }
  if(a==="debt-skip"){ freezeDay(date); var ex=debtOf(date,cid); var by=(ex&&ex.st==="claim")?ex.by:computeAssignments(date).assign[cid]; commit({t:"debt-skip",s:date,cid:cid,by:by}); return; }
  if(a==="restday"){ commit({t:"restday",pid:t.getAttribute("data-pid"),d:+t.getAttribute("data-d")}); return; }
  if(a==="away-add"){ var apid=t.getAttribute("data-pid"),af=document.getElementById("awayfrom-"+apid),at=document.getElementById("awayto-"+apid),fv=af&&af.value,tv=at&&at.value; if(!fv||!tv){ if(af&&!fv)af.focus(); return; } if(fv>tv){ var sw=fv; fv=tv; tv=sw; } commit({t:"away-add",pid:apid,from:fv,to:tv}); return; }
  if(a==="away-del"){ commit({t:"away-del",pid:t.getAttribute("data-pid"),idx:+t.getAttribute("data-idx")}); return; }
  if(a==="reset-ov"){ commit({t:"reset-ov",s:todayStr()}); return; }
  if(a==="week"){ var dd=t.getAttribute("data-d"); ui.weekOffset=(dd==="0")?0:(ui.weekOffset+(+dd)); saveUI(); render(); return; }
  if(a==="anper"){ ui.anPeriod=+t.getAttribute("data-n"); saveUI(); render(); return; }
  if(a==="toggle-sec"){ var sec=t.getAttribute("data-sec"); ui[sec]=!ui[sec]; saveUI(); var disc=root.querySelector('[data-disc="'+sec+'"]'); if(disc)disc.classList.toggle("open",ui[sec]); return; }
  if(a==="mode"){ commit({t:"mode",mode:t.getAttribute("data-mode")}); return; }
  if(a==="pts"){ commit({t:"edit",id:cid,patch:{points:+t.getAttribute("data-val")}}); return; }
  if(a==="dow"){ var ch=getChore(cid),d2=(ch.freq.d||[]).slice(),dv=+t.getAttribute("data-d"),ix=d2.indexOf(dv); if(ix>=0)d2.splice(ix,1); else d2.push(dv); commit({t:"edit",id:cid,patch:{freq:{t:"dow",d:d2}}}); return; }
  if(a==="cyc"){ commit({t:"edit",id:cid,patch:{freq:{t:"everyN",n:+t.getAttribute("data-n"),anchor:(getChore(cid).freq.anchor||todayStr())}}}); return; }
  if(a==="del"){ if(t.classList.contains("arm")){ commit({t:"del",id:cid}); } else { t.classList.add("arm"); t.textContent="Точно?"; setTimeout(function(){ if(t){t.classList.remove("arm");t.textContent="Удалить";} },2600); } return; }
  if(a==="add"){ var inp=document.getElementById("newtitle"),v=(inp&&inp.value||"").trim(); if(!v)return; commit({t:"add",chore:{id:uid(),title:v,points:1,perDay:1,cat:"",why:"",freq:{t:"daily"}}}); return; }
  if(a==="edit-chore"){ ui.editing=(ui.editing===cid?null:cid); saveUI(); render(); return; }
  if(a==="an-details"){ ui.anDetails=!ui.anDetails; saveUI(); render(); return; }
  if(a==="help"){ showHelp(); return; }
});
root.addEventListener("change",function(e){
  var t=e.target.closest("[data-action]"); if(!t)return;
  var a=t.getAttribute("data-action"),cid=t.getAttribute("data-cid");
  if(a==="ftype"){ var v=t.value; if(v==="after"){ var oth=state.chores.filter(function(o){return o.id!==cid;}); commit({t:"edit",id:cid,patch:{freq:{t:"after"},after:{on:(oth[0]?oth[0].id:""),delayDays:0}}}); return; } var patch; if(v==="daily")patch={t:"daily"}; else if(v==="dow")patch={t:"dow",d:[]}; else if(v==="once")patch={t:"once",date:todayStr()}; else patch={t:"everyN",n:2,anchor:todayStr()}; commit({t:"edit",id:cid,patch:{freq:patch,after:null}}); return; }
  if(a==="depon"){ var dch=getChore(cid); commit({t:"edit",id:cid,patch:{after:{on:t.value,delayDays:(dch.after&&dch.after.delayDays)||0}}}); return; }
  if(a==="depdelay"){ var dc2=getChore(cid),ddv=Math.max(0,Math.min(30,Math.round(+t.value||0))); commit({t:"edit",id:cid,patch:{after:{on:(dc2.after&&dc2.after.on)||"",delayDays:ddv}}}); return; }
  if(a==="oncedate"){ commit({t:"edit",id:cid,patch:{freq:{t:"once",date:t.value||todayStr()}}}); return; }
  if(a==="cap"){ commit({t:"cap",p1:Math.max(0,Math.min(100,Math.round((+t.value||50)/5)*5))}); return; }
  if(a==="everyn"){ var n=Math.max(1,Math.min(365,+t.value||1)); commit({t:"edit",id:cid,patch:{freq:{t:"everyN",n:n,anchor:(getChore(cid).freq.anchor||todayStr())}}}); return; }
  if(a==="ptsnum"){ var pv=Math.max(0.5,Math.min(20,+t.value||1)); commit({t:"edit",id:cid,patch:{points:pv}}); return; }
  if(a==="perday"){ var pd=Math.max(1,Math.min(12,Math.round(+t.value||1))); commit({t:"edit",id:cid,patch:{perDay:pd}}); return; }
  if(a==="owner"){ commit({t:"edit",id:cid,patch:{owner:t.value||undefined}}); return; }
});
root.addEventListener("input",function(e){
  var cs=e.target.closest('[data-action="chsearch"]'); if(cs){ choreQuery=cs.value; applyChoreFilter(); return; }
  var t=e.target.closest('[data-action="cap"]'); if(!t)return;
  var v=Math.max(0,Math.min(100,+t.value||50)),row=t.closest(".caprow");
  if(row){ var l1=row.querySelector(".caplab.p1"),l2=row.querySelector(".caplab.p2"); if(l1)l1.textContent=getPerson("p1").name+" "+v+"%"; if(l2)l2.textContent=getPerson("p2").name+" "+(100-v)+"%"; }
});
root.addEventListener("focusout",function(e){
  var t=e.target.closest("[data-action]"); if(!t)return;
  var a=t.getAttribute("data-action"),cid=t.getAttribute("data-cid");
  if(a==="title"){ commit({t:"edit",id:cid,patch:{title:(t.value.trim()||getChore(cid).title)}}); return; }
  if(a==="why"){ commit({t:"edit",id:cid,patch:{why:t.value.trim()}}); return; }
  if(a==="cat"){ commit({t:"edit",id:cid,patch:{cat:t.value.trim()}}); return; }
  if(a==="rename"){ commit({t:"rename",pid:t.getAttribute("data-pid"),name:(t.value.trim()||getPerson(t.getAttribute("data-pid")).name)}); return; }
});
root.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  if(e.target.id==="newtitle"){ e.preventDefault(); var b=root.querySelector('[data-action="add"]'); if(b)b.click(); return; }
  if(e.target.id==="disputeinput"){ e.preventDefault(); var dcf=e.target.closest("li").querySelector('[data-action="disp-confirm"]'); if(dcf)dcf.click(); return; }
  var t=e.target.closest("[data-action]"); if(t){ var a=t.getAttribute("data-action"); if(a==="title"||a==="why"||a==="rename"||a==="cat"||a==="everyn"||a==="ptsnum"||a==="perday")t.blur(); }
});
window.addEventListener("scroll",function(){ if(scrollTimer)return; scrollTimer=setTimeout(function(){ scrollTimer=null; try{ sessionStorage.setItem(SCKEY,String(window.scrollY||window.pageYOffset||0)); }catch(e){} },250); },{passive:true});
window.addEventListener("pagehide",function(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; save(); } });

function uid(){ try{ if(crypto&&crypto.randomUUID)return "c_"+crypto.randomUUID().slice(0,8); }catch(e){} return "c_"+Math.floor((1+Math.random())*1e9).toString(36); }

function showHelp(){
  var m=document.getElementById("hcmodal"); if(m){ m.remove(); return; }
  m=document.createElement("div"); m.id="hcmodal";
  m.setAttribute("style","position:fixed;inset:0;background:rgba(8,30,36,.5);display:grid;place-items:center;z-index:50;padding:18px");
  m.innerHTML='<div class="glass" style="max-width:430px;padding:22px 24px;font-size:14.5px;line-height:1.5"><div style="font-family:var(--font-display);font-weight:600;font-size:19px;margin-bottom:10px;color:var(--ink)">Общий доступ вдвоём</div><div style="color:var(--muted)">Откройте эту страницу по одной и той же ссылке на обоих телефонах — данные синхронизируются автоматически через ваш Firebase.<br><br>На каждом устройстве вверху выберите «Это я» (Егор или Маша). Свой список идёт первым, и отмечать выполненное можно только в нём — колонка второго показана как «только просмотр», чтобы случайно не трогать чужие дела.<br><br>Под каждым своим делом три кнопки: «Передать» — отдать дело второму, «Завтра» — перенести на завтра (появится в полосе «Перенесено», можно вернуть), «Не буду» — снять с себя (усилия учтутся в аналитике). Отметки, переносы и настройки сразу видны обоим.</div><div style="text-align:right;margin-top:16px"><button class="btn" data-action="help">Понятно</button></div></div>';
  m.addEventListener("click",function(ev){ if(ev.target===m)m.remove(); });
  document.body.appendChild(m);
}

/* ---------- sync (Firebase) / local fallback ---------- */
function configured(){ try{ return !!(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey.indexOf("ВСТАВЬ")<0); }catch(e){ return false; } }
function scheduleSave(){ setStatus("saving"); if(saveTimer)clearTimeout(saveTimer); saveTimer=setTimeout(save,450); }
function save(){
  saveTimer=null;
  if(fbReady&&fbRef){
    lastWritten=JSON.stringify(state);
    fbRef.set(state).then(function(){ setStatus(online?"saved":"offline"); }).catch(function(){ setStatus("error"); if(saveTimer)clearTimeout(saveTimer); saveTimer=setTimeout(save,1600); });
  } else {
    try{ localStorage.setItem(LSKEY,JSON.stringify(state)); }catch(e){}
    setStatus("local");
  }
}
function startLocal(){
  try{ var ls=localStorage.getItem(LSKEY); if(ls) state=normalize(JSON.parse(ls)); }catch(e){}
  migrateFreeze();
  render(); setStatus("local");
}
function init(){
  render();
  if(!configured()||typeof firebase==="undefined"){ startLocal(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    var db=firebase.database();
    fbRef=db.ref("rooms/"+ROOM_ID+"/state");
    db.ref(".info/connected").on("value",function(snap){ online=!!snap.val(); if(statusName!=="saving")setStatus(online?"saved":"offline"); });
    fbRef.on("value",function(snap){
      var v=snap.val(); fbReady=true;
      if(v==null){ lastWritten=JSON.stringify(state); fbRef.set(state); render(); setStatus(online?"saved":"offline"); return; }
      var j=JSON.stringify(v);
      if(j===lastWritten) return;
      state=normalize(v); if(migrateFreeze())scheduleSave(); render(); setStatus(online?"saved":"offline");
    },function(){ setStatus("error"); });
  }catch(e){ startLocal(); }
}
init();
})();
