<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Домашние дела</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 4 3 15h3v13h7v-8h6v8h7V15h3z%27 fill=%27%2306b6d4%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style id="appstyle">
:root{
  --ink:#0f2a30; --text:#123138; --muted:#4c6169; --faint:#8399a0;
  --line:rgba(14,60,70,.14); --line-2:rgba(14,60,70,.08);
  --glass:rgba(255,255,255,.56); --glass-2:rgba(255,255,255,.40); --glass-brd:rgba(255,255,255,.72);
  --glass-sh:0 6px 26px rgba(8,54,64,.12), inset 0 1px 0 rgba(255,255,255,.5);
  --field:rgba(255,255,255,.7);
  --cy:#06b6d4; --cy-ink:#0e7490; --cy-soft:rgba(6,182,212,.14);
  --p1:#16a34a; --p1-ink:#0f7a37; --p1-soft:rgba(22,163,74,.15);
  --p2:#ec4899; --p2-ink:#bd2e74; --p2-soft:rgba(236,72,153,.15);
  --warn:#c2710c; --warn-soft:rgba(217,119,6,.15);
  --radius:16px;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-ui:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);font-family:var(--font-ui);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:linear-gradient(165deg,#e4f2f4 0%,#edf7f8 45%,#f2eff6 100%);min-height:100vh}
body::before{content:"";position:fixed;inset:-20% -10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38vw 38vw at 12% 8%, rgba(6,182,212,.34), transparent 60%),
    radial-gradient(34vw 34vw at 88% 12%, rgba(34,211,238,.26), transparent 60%),
    radial-gradient(40vw 40vw at 78% 88%, rgba(236,72,153,.20), transparent 62%),
    radial-gradient(36vw 36vw at 8% 92%, rgba(22,163,74,.20), transparent 62%);
  filter:blur(20px) saturate(1.1)}
#root{max-width:940px;margin:0 auto;padding:22px 16px 72px}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:15px;color:var(--text)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--glass-brd);box-shadow:var(--glass-sh);border-radius:var(--radius)}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  .glass{background:rgba(255,255,255,.86)}
}

/* header */
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 16px;margin-bottom:18px}
.hd .ttl{font-family:var(--font-display);font-weight:600;font-size:31px;letter-spacing:-.01em;line-height:1.05;color:var(--ink)}
.hd .date{color:var(--muted);font-size:15px;font-weight:500;text-transform:capitalize}
.hd .spacer{flex:1 1 40px}
.me{display:inline-flex;padding:3px;gap:2px;border-radius:999px}
.me span{font-size:12px;color:var(--faint);align-self:center;padding:0 8px 0 10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.me button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:6px 13px;border-radius:999px;transition:.12s}
.me button.on{background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(8,54,64,.12)}
.me button.on.p1{color:var(--p1-ink)}
.me button.on.p2{color:var(--p2-ink)}

/* completion cards */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.pcard{padding:15px 17px;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.pcard.you{box-shadow:0 0 0 2px var(--pc), var(--glass-sh)}
.pcard .nm{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.pcard .nm b{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--pc-ink)}
.pcard .youtag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pc-ink);background:var(--pc-soft);padding:2px 8px;border-radius:999px}
.pcard .big{display:flex;align-items:baseline;gap:8px}
.pcard .pct{font-size:35px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--pc-ink)}
.pcard .sub{color:var(--muted);font-size:13px;font-weight:500}
.bar{height:8px;background:rgba(14,60,70,.09);border-radius:999px;margin-top:11px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pc);border-radius:999px;transition:width .35s ease}

/* balance strip */
.balance{padding:14px 17px;margin-bottom:22px}
.balance .bh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:9px}
.balance .bh .t{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.balance .bh .meta{color:var(--faint);font-size:13px;font-weight:500}
.balance .bh .reset{margin-left:auto;border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600}
.split{display:flex;height:26px;border-radius:9px;overflow:hidden;background:rgba(14,60,70,.08);gap:2px}
.split > span{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;min-width:0;transition:flex-basis .35s ease;white-space:nowrap;overflow:hidden}
.split .s1{background:var(--p1)} .split .s2{background:var(--p2);color:#fff}
.split .s0{background:transparent;color:var(--faint);flex:1;font-weight:500}
.balance .legend{color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.45}

/* section head */
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.sec-h h2{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.sec-h .ln{flex:1;height:1px;background:var(--line)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{overflow:hidden}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--pc-soft)}
.col-h b{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--pc-ink)}
.col-h .mini{font-size:12.5px;font-weight:600;color:var(--pc-ink);opacity:.9}
.tasks{list-style:none;margin:0;padding:6px}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 8px;border-radius:11px;transition:background .12s}
.task + .task{border-top:1px solid var(--line-2)}
.task:hover{background:rgba(255,255,255,.4)}
.ck{flex:0 0 auto;width:25px;height:25px;border-radius:8px;border:2px solid var(--pc);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px;transition:.12s}
.ck svg{width:14px;height:14px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0;transition:.12s}
.task.ok .ck{background:var(--pc);border-color:var(--pc)}
.task.ok .ck svg{opacity:1}
.step{flex:0 0 auto;display:inline-flex;align-items:center;border:1.5px solid var(--pc);border-radius:9px;overflow:hidden;margin-top:0}
.step button{border:0;background:transparent;color:var(--pc-ink);width:24px;height:26px;font-size:15px;font-weight:700;padding:0;line-height:1}
.step .n{font-size:12px;font-weight:700;color:var(--pc-ink);min-width:30px;text-align:center;padding:0 2px}
.step.full{background:var(--pc)}
.step.full button,.step.full .n{color:#fff}
.tbody{flex:1;min-width:0}
.tt{font-weight:600;font-size:15px;line-height:1.25;word-break:break-word}
.task.ok .tt,.task.skip .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.why{color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px;opacity:.85}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
.chip{font-size:11.5px;font-weight:600;color:var(--muted);background:rgba(14,60,70,.06);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px}
.chip.eff{color:var(--pc-ink);background:var(--pc-soft);border-color:transparent}
.chip.rep{color:var(--cy-ink);background:var(--cy-soft);border-color:transparent}
.chip.skipped{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.reps{display:inline-flex;align-items:center;border:1px solid var(--cy);background:var(--cy-soft);border-radius:7px;overflow:hidden}
.reps .rb{border:0;background:transparent;color:var(--cy-ink);width:22px;height:22px;font-size:15px;font-weight:700;padding:0;line-height:1}
.reps .rb:active{background:rgba(6,182,212,.2)}
.reps .rn{font-size:11.5px;font-weight:700;color:var(--cy-ink);padding:0 5px;white-space:nowrap}
.acts{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
.mini-btn{border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:8px;height:28px;min-width:30px;padding:0 7px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;justify-content:center;transition:.12s;white-space:nowrap}
.mini-btn:hover{color:var(--text);border-color:var(--faint)}
.mini-btn svg{width:13px;height:13px}
.mini-btn.skip:hover{color:var(--warn);border-color:var(--warn)}
.mini-btn.restore{color:var(--cy-ink);border-color:var(--cy)}
.empty{padding:22px 14px;text-align:center;color:var(--faint);font-size:14px;font-weight:500}

/* weekly calendar */
.wknav{display:flex;align-items:center;gap:8px;margin:0 2px 12px}
.wknav .nb{border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:9px;height:34px;width:38px;font-size:16px;display:grid;place-items:center}
.wknav .lbl{font-weight:600;font-size:14px}
.wknav .lbl small{display:block;color:var(--faint);font-weight:500;font-size:12px}
.wknav .today{margin-left:auto;border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:9px;height:34px;padding:0 12px;font-weight:600;font-size:13px}
.cal{display:flex;flex-direction:column;gap:10px}
.calday{overflow:hidden}
.calday.today{box-shadow:0 0 0 2px var(--cy), var(--glass-sh)}
.calday.past{opacity:.7}
.caltop{display:flex;align-items:center;gap:9px;padding:9px 15px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.35)}
.caltop .dw{font-family:var(--font-display);font-weight:600;font-size:15px;text-transform:capitalize}
.caltop .dd{color:var(--muted);font-size:13px;font-weight:500}
.caltop .tb{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--cy);padding:2px 7px;border-radius:999px}
.caltop .csplit{margin-left:auto;display:flex;height:14px;width:150px;max-width:42vw;border-radius:5px;overflow:hidden;background:rgba(14,60,70,.1);gap:1px}
.caltop .csplit i{display:block;height:100%}
.caltop .csplit .c1{background:var(--p1)} .caltop .csplit .c2{background:var(--p2)}
.calcols{display:grid;grid-template-columns:1fr 1fr}
.calcol{padding:8px 13px;min-width:0}
.calcol:first-child{border-right:1px solid var(--line)}
.calcol .cn{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
.calcol.c1 .cn{color:var(--p1-ink)} .calcol.c2 .cn{color:var(--p2-ink)}
.calitem{display:flex;align-items:flex-start;gap:6px;padding:3px 0;font-size:13.5px;line-height:1.3}
.calitem .cd{flex:1;min-width:0;word-break:break-word}
.calitem.ok .cd{color:var(--faint);text-decoration:line-through}
.calitem.skip .cd{color:var(--warn);text-decoration:line-through}
.calitem .ce{color:var(--faint);font-size:11px;font-weight:600;white-space:nowrap}
.calitem .cs{flex:0 0 auto;border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:6px;width:24px;height:22px;font-size:12px;line-height:1;display:grid;place-items:center;padding:0}
.calcol .cempty{color:var(--faint);font-size:13px;padding:2px 0}

/* analytics */
.an-per{display:inline-flex;gap:2px;padding:3px;border-radius:999px;margin:0 2px 12px}
.an-per button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;padding:6px 14px;border-radius:999px}
.an-per button.on{background:var(--cy);color:#fff}
.an-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.an-card{padding:15px 17px;position:relative;overflow:hidden}
.an-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.an-card .anh{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--pc-ink);margin-bottom:12px}
.an-kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.kpi .kl{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--faint)}
.kpi .kv{font-size:24px;font-weight:700;letter-spacing:-.01em;color:var(--text);line-height:1.1;margin-top:2px}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi.hl .kv{color:var(--pc-ink)}
.an-note{color:var(--faint);font-size:12.5px;margin-top:10px;line-height:1.4}
.fair{padding:14px 17px;margin-bottom:12px}
.fair .fl{font-family:var(--font-display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);margin-bottom:9px}
.chartcard{padding:14px 16px 10px}
.chartcard .cl{font-family:var(--font-display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);margin-bottom:6px}
.chartcard .cleg{display:flex;gap:14px;margin-bottom:6px;font-size:12.5px;font-weight:600}
.chartcard .cleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
svg .grid{stroke:var(--line-2)} svg .axis{stroke:var(--line)}
svg text.tick{fill:var(--faint);font-size:10.5px;font-family:var(--font-ui)}
.catwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.catlist .cr{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.catlist .cr .cb{flex:1;height:8px;border-radius:999px;background:rgba(14,60,70,.08);overflow:hidden}
.catlist .cr .cb i{display:block;height:100%;background:var(--pc);border-radius:999px}
.catlist .cr .cnm{width:96px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catlist .cr .cvv{width:44px;text-align:right;color:var(--faint);font-weight:600}

/* collapsible */
.disc{overflow:hidden}
.disc > .dh{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:transparent;color:var(--text);
  padding:14px 16px;font-family:var(--font-ui);font-weight:600;font-size:15px;text-align:left}
.disc > .dh .cnt{color:var(--faint);font-weight:600;font-size:13px;margin-left:auto;padding-left:10px}
.disc > .dh .car{transition:transform .18s;color:var(--faint)}
.disc.open > .dh .car{transform:rotate(90deg)}
.disc .db{padding:2px 14px 16px;display:none}
.disc.open .db{display:block}

/* mode + manage */
.modes{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.modes .m{border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px;flex:1 1 auto;text-align:center;min-width:120px}
.modes .m.on{background:var(--cy);color:#fff;border-color:var(--cy)}
.hint{color:var(--faint);font-size:12.5px;margin:-6px 2px 14px;line-height:1.45}
.effleg{display:flex;flex-wrap:wrap;gap:6px;margin:2px 2px 16px}
.effleg .e{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--field);border:1px solid var(--line-2);border-radius:7px;padding:3px 8px}
.effleg .e b{color:var(--text)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.m-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.m-title{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 6px;font-weight:600;font-size:15px;margin-left:-6px}
.m-title:hover{border-color:var(--line)}
.m-title:focus{border-color:var(--cy);background:var(--field)}
.m-why{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:3px 6px;font-size:13px;color:var(--muted);margin-left:-6px;font-family:inherit}
.m-why:hover{border-color:var(--line)}
.m-why:focus{border-color:var(--cy);background:var(--field);color:var(--text)}
.m-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--faint)}
.pts{display:inline-flex;gap:3px}
.pts button{border:1px solid var(--line);background:var(--field);color:var(--muted);height:28px;padding:0 8px;border-radius:7px;font-weight:700;font-size:12px;white-space:nowrap}
.pts button.on{background:var(--cy);color:#fff;border-color:transparent}
select,.m-n,.m-cat,.m-num{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:5px 8px;font-size:13.5px;font-weight:500}
.m-n,.m-num{width:62px}
.m-cat{width:118px}
.effword{font-size:12px;font-weight:700;color:var(--cy-ink);min-width:64px}
.dow{display:inline-flex;gap:3px}
.dow button{border:1px solid var(--line);background:var(--field);color:var(--muted);width:30px;height:28px;border-radius:7px;font-weight:600;font-size:12px;padding:0}
.dow button.on{background:var(--cy);color:#fff;border-color:transparent}
.m-side{display:flex;align-items:center;gap:6px}
.del{border:1px solid var(--line);background:var(--field);color:var(--faint);border-radius:8px;height:30px;padding:0 9px;font-size:13px;font-weight:600}
.del.arm{background:#e5484d;border-color:#e5484d;color:#fff}
.addrow{display:flex;gap:8px;margin-top:16px}
.addrow input{flex:1;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 12px;font-size:15px}
.btn{border:1px solid var(--cy);background:var(--cy);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.people-edit{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 4px}
.pe{display:flex;flex-direction:column;gap:4px}
.pe label{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.pe.p1 label{color:var(--p1-ink)} .pe.p2 label{color:var(--p2-ink)}
.pe input{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:7px 10px;font-weight:600;font-size:15px;width:170px}

/* capacity + cycles */
.caprow{display:flex;align-items:center;gap:10px;margin:2px 2px 6px}
.capslider{flex:1;accent-color:var(--cy);height:4px;max-width:340px}
.caplab{font-size:12.5px;font-weight:700;white-space:nowrap}
.caplab.p1{color:var(--p1-ink)} .caplab.p2{color:var(--p2-ink)}
.cyc{display:inline-flex;gap:3px;margin-left:2px}
.cycb{border:1px solid var(--line);background:var(--field);color:var(--muted);height:28px;padding:0 8px;border-radius:7px;font-weight:600;font-size:12px}
.cycb.on{background:var(--cy);color:#fff;border-color:transparent}
.chip.moved{color:var(--cy-ink);background:var(--cy-soft);border-color:transparent}

/* footer */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:22px;color:var(--faint);font-size:13px}
.st{display:inline-flex;align-items:center;gap:7px;font-weight:600}

/* ---------- date helpers ---------- */
function pad(n){ return n<10?"0"+n:""+n; }

/* ---------- effort ---------- */
function effortOf(c){ return (c.points||0)*(c.perDay||1); }

function effWord(v){ if(v<=0.5)return"мелочь"; if(v<=1)return"минимум"; if(v<=2)return"лёгкое"; if(v<=3)return"среднее"; if(v<=5)return"тяжёлое"; return"очень тяжёлое"; }

/* ---------- distribution (pure) ---------- */

/* ---------- analytics ---------- */
function analytics(days){

function applyOp(o){
  var s=o.s,c;
  if(o.t==="units"||o.t==="toggle"){ var v=(o.t==="toggle")?(o.val?1:0):o.val; if(!state.done[s])state.done[s]={}; if(v>0)state.done[s][o.cid]=v; else delete state.done[s][o.cid]; if(v>0&&state.skip[s])delete state.skip[s][o.cid]; }
  else if(o.t==="skip"){ if(o.on){ if(!state.skip[s])state.skip[s]={}; state.skip[s][o.cid]=o.pid; if(state.done[s])delete state.done[s][o.cid]; } else { if(state.skip[s])delete state.skip[s][o.cid]; } }
  else if(o.t==="assign"){ if(!state.overrides[s])state.overrides[s]={}; state.overrides[s][o.cid]=o.to; }
  else if(o.t==="reset-ov"){ delete state.overrides[s]; }
  else if(o.t==="snooze"){ var nd=addDays(s,1); if(!state.moved[s])state.moved[s]={}; state.moved[s][o.cid]=1; if(!state.extra[nd])state.extra[nd]={}; state.extra[nd][o.cid]=1; if(state.done[s])delete state.done[s][o.cid]; if(state.skip[s])delete state.skip[s][o.cid]; }
  else if(o.t==="cap"){ if(!state.capacity)state.capacity={}; state.capacity.p1=o.p1; }
  else if(o.t==="mode"){ state.mode=o.mode; }
  else if(o.t==="rename"){ var p=getPerson(o.pid); if(p)p.name=o.name; }
  else if(o.t==="add"){ if(!getChore(o.chore.id))state.chores.push(o.chore); }
  else if(o.t==="del"){ state.chores=state.chores.filter(function(x){return x.id!==o.id;}); }
  else if(o.t==="edit"){ c=getChore(o.id); if(c){ for(var k in o.patch)c[k]=o.patch[k]; } }
}
function commit(o){ applyOp(o); render(); scheduleSave(); }

  h+='<ul class="tasks">';
  mine.forEach(function(c){
    var sk=isSkipped(s,c.id),pd=targetOf(c,s),u=Math.min(pd,unitsOf(s,c.id)),full=u>=pd,ok=full&&!sk;

    if(c.why)h+='<div class="why">'+esc(c.why)+'</div>';
    h+='<div class="meta"><span class="chip eff">'+fmtPts(c.points)+' · '+esc(effWord(c.points))+'</span>';
    if(isReactive(c)){ h+='<span class="chip rep">'+esc(depLabel(c))+'</span>'; } else { h+='<span class="reps"><button class="rb" data-action="reps-dec" data-cid="'+c.id+'" title="Реже (раз в день)" aria-label="Меньше раз в день">−</button><span class="rn tnum">'+pd+'×/день</span><button class="rb" data-action="reps-inc" data-cid="'+c.id+'" title="Чаще (раз в день)" aria-label="Больше раз в день">+</button></span>'; }

function kpi(label,val,hl){ return '<div class="kpi'+(hl?' hl':'')+'"><div class="kl">'+label+'</div><div class="kv tnum">'+val+'</div></div>'; }

function trendSVG(trend){
  var W=680,H=150,pl=34,pr=54,pt=12,pb=22,pw=W-pl-pr,ph=H-pt-pb,n=trend.length;
  function X(i){ return pl+(n<=1?pw/2:i*pw/(n-1)); }
  function Y(v){ return pt+(1-v/100)*ph; }
  var g='';
  [0,25,50,75,100].forEach(function(v){ var y=Y(v); g+='<line class="grid" x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'"/>'; g+='<text class="tick" x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">'+v+'</text>'; });
  var step=Math.max(1,Math.ceil(n/7));
  for(var i=0;i<n;i++){ if(i%step===0||i===n-1){ var d=parseYMD(trend[i].s); g+='<text class="tick" x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+d.getDate()+"."+pad(d.getMonth()+1)+'</text>'; } }
  function series(key,color){
    var path="",dots="",started=false;
    for(var i=0;i<n;i++){ var v=trend[i][key]; if(v==null)continue; var x=X(i),y=Y(v); path+=(started?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" "; started=true;
      dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.4" fill="'+color+'"><title>'+esc(fmtDate(trend[i].s))+": "+v+'%</title></circle>'; }
    return path?('<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots):dots;
  }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Выполнение по дням">';
  svg+='<line class="axis" x1="'+pl+'" y1="'+(pt+ph)+'" x2="'+(W-pr)+'" y2="'+(pt+ph)+'"/>';
  svg+=g+series("p1","var(--p1)")+series("p2","var(--p2)");
  /* end labels */
  var last1=null,last2=null; for(var i=0;i<n;i++){ if(trend[i].p1!=null)last1=i; if(trend[i].p2!=null)last2=i; }
  var y1=last1!=null?Y(trend[last1].p1):null, y2=last2!=null?Y(trend[last2].p2):null, o1=3, o2=3;
  if(y1!=null&&y2!=null&&Math.abs(y1-y2)<14){ o1=-3; o2=14; }
  if(last1!=null)svg+='<text class="tick" x="'+(X(last1)+7)+'" y="'+(y1+o1)+'" fill="var(--p1-ink)" font-weight="700" text-anchor="start">'+esc(getPerson("p1").name)+'</text>';
  if(last2!=null)svg+='<text class="tick" x="'+(X(last2)+7)+'" y="'+(y2+o2)+'" fill="var(--p2-ink)" font-weight="700" text-anchor="start">'+esc(getPerson("p2").name)+'</text>';
  return svg+'</svg>';
}
function catCard(pid,catObj){
  var arr=[]; for(var k in catObj)arr.push([k,catObj[k]]); arr.sort(function(a,b){return b[1]-a[1];});
  var max=arr.length?arr[0][1]:1;
  var h='<div class="chartcard glass '+pid+'" style="'+pcVars(pid)+'"><div class="cl">'+esc(getPerson(pid).name)+' — по разделам</div><div class="catlist">';
  if(!arr.length)h+='<div class="cempty" style="color:var(--faint);font-size:13px">пока нет выполненных дел</div>';
  else arr.slice(0,6).forEach(function(e){ h+='<div class="cr"><span class="cnm">'+esc(e[0])+'</span><span class="cb"><i style="width:'+Math.round(e[1]/max*100)+'%"></i></span><span class="cvv tnum">'+fmtPts(e[1])+'</span></div>'; });
  return h+'</div></div>';
}

  h+=capacityHTML();
  h+='<div class="lbl">Усилия — что значат оценки</div><div class="effleg">';
  EFF_LEGEND.forEach(function(e){ h+='<span class="e"><b>'+e[0]+'</b> '+e[1]+'</span>'; });
  h+='</div>';
  h+='<div class="lbl">Участники</div><div class="people-edit">';
  state.people.forEach(function(p){ h+='<div class="pe '+p.id+'"><label>'+(p.id==="p1"?"Первый":"Второй")+'</label><input data-action="rename" data-pid="'+p.id+'" value="'+esc(p.name)+'" maxlength="24"></div>'; });
  h+='</div>';
  h+='<div class="lbl" style="margin:16px 0 2px">Список дел</div><datalist id="cats">'+CATS.map(function(c){return '<option value="'+esc(c)+'">';}).join("")+'</datalist>';
  state.chores.forEach(function(c){ h+=choreRow(c); });
  h+='<div class="addrow"><input id="newtitle" placeholder="Новое дело…" maxlength="80"><button class="btn" data-action="add">Добавить</button></div>';
  return h+'</div></div></div>';
}
function modeHint(){
  if(state.mode==="balanced")return "Каждый день дела делятся так, чтобы сумма усилий у обоих была примерно равной; тяжёлые дела чередуются день ото дня. Любое дело можно передать вручную «→», а «⊘ не буду» освобождает усилия.";
  if(state.mode==="rotate")return "Одни и те же дела переходят от одного к другому по чётным/нечётным дням.";
  return "У каждого свои закреплённые дела (выбор ниже). Незакреплённые делятся поровну по усилиям.";
}
function choreRow(c){
  var f=c.freq||{t:"daily"},pd=c.perDay||1;
  var h='<div class="mrow" data-cid="'+c.id+'"><div class="m-main">';
  h+='<input class="m-title" data-action="title" data-cid="'+c.id+'" value="'+esc(c.title)+'" maxlength="80">';
  h+='<input class="m-why" data-action="why" data-cid="'+c.id+'" value="'+esc(c.why||"")+'" placeholder="почему такая оценка (напр. ≈15 мин, физически тяжело)" maxlength="120">';
  h+='<div class="m-line"><span class="lbl">Усилия</span><span class="pts">';
  PTS.forEach(function(v){ h+='<button class="'+(c.points===v?'on':'')+'" data-action="pts" data-cid="'+c.id+'" data-val="'+v+'">'+fmtPts(v)+'</button>'; });
  h+='</span><input class="m-num tnum" type="number" min="0.5" max="20" step="0.5" data-action="ptsnum" data-cid="'+c.id+'" value="'+fmtPts(c.points)+'"><span class="effword">'+esc(effWord(c.points))+'</span></div>';
  var reactive=isReactive(c);
  if(!reactive){ h+='<div class="m-line"><span class="lbl">Раз в день</span><input class="m-num tnum" type="number" min="1" max="12" step="1" data-action="perday" data-cid="'+c.id+'" value="'+pd+'"><span class="lbl" style="margin-left:6px">Итого за день</span><span class="effword">'+fmtPts(effortOf(c))+' ус.</span></div>'; }
  h+='<div class="m-line"><span class="lbl">Когда</span><select data-action="ftype" data-cid="'+c.id+'">';
  [["daily","Каждый день"],["dow","По дням недели"],["everyN","Цикл (раз в N дней)"],["once","Разовая (дата)"],["after","После другого дела"]].forEach(function(o){ var selv=(o[0]==="after")?reactive:(!reactive&&f.t===o[0]); h+='<option value="'+o[0]+'"'+(selv?' selected':'')+'>'+o[1]+'</option>'; });
  h+='</select>';
  if(reactive){ h+='<span class="lbl">после</span><select data-action="depon" data-cid="'+c.id+'">'; state.chores.forEach(function(o){ if(o.id!==c.id) h+='<option value="'+o.id+'"'+(c.after.on===o.id?' selected':'')+'>'+esc(o.title)+'</option>'; }); h+='</select><span class="lbl">через</span><input class="m-n tnum" type="number" min="0" max="14" step="1" data-action="depdelay" data-cid="'+c.id+'" value="'+Math.round(c.after.delayDays||0)+'"><span class="lbl">дн. (0 = сразу)</span>'; }
  else if(f.t==="dow"){ h+='<span class="dow">'; WD_ORDER.forEach(function(d){ h+='<button class="'+((f.d||[]).indexOf(d)>=0?'on':'')+'" data-action="dow" data-cid="'+c.id+'" data-d="'+d+'">'+WD[d]+'</button>'; }); h+='</span>'; }
  else if(f.t==="everyN"){ h+='<span class="lbl">каждые</span><input class="m-n tnum" type="number" min="1" max="365" data-action="everyn" data-cid="'+c.id+'" value="'+(f.n||1)+'"><span class="lbl">дн.</span><span class="cyc">'; [["нед",7],["мес",30],["кв",91],["полгода",182],["год",365]].forEach(function(pr){ h+='<button class="cycb'+((f.n||1)===pr[1]?' on':'')+'" data-action="cyc" data-cid="'+c.id+'" data-n="'+pr[1]+'">'+pr[0]+'</button>'; }); h+='</span>'; }
  else if(f.t==="once"){ h+='<span class="lbl">дата</span><input class="m-cat" type="date" data-action="oncedate" data-cid="'+c.id+'" value="'+esc(f.date||todayStr())+'">'; }
  h+='<input class="m-cat" list="cats" data-action="cat" data-cid="'+c.id+'" value="'+esc(c.cat||"")+'" placeholder="раздел">';
  if(state.mode==="fixed"){ h+='<select data-action="owner" data-cid="'+c.id+'"><option value="">Авто</option>'; state.people.forEach(function(p){ h+='<option value="'+p.id+'"'+(c.owner===p.id?' selected':'')+'>'+esc(p.name)+'</option>'; }); h+='</select>'; }
  h+='</div></div><div class="m-side"><button class="del" data-action="del" data-cid="'+c.id+'">Удалить</button></div></div>';
  return h;
}

function statusText(){ return {idle:"",saving:"Сохранение…",saved:"Синхронизировано",offline:"Оффлайн — сохранится, когда появится связь",local:"Локально на этом устройстве (Firebase не настроен)",error:"Ошибка сохранения, повтор…"}[statusName]||""; }
function setStatus(n){ statusName=n; var el=document.getElementById("st"); if(el){ el.className="st "+n; el.innerHTML='<span class="dot"></span>'+statusText(); } }

/* ---------- events ---------- */
root.addEventListener("click",function(e){
  var t=e.target.closest("[data-action]"); if(!t)return;
  var a=t.getAttribute("data-action"),cid=t.getAttribute("data-cid"),date=t.getAttribute("data-date")||todayStr();
  if(a==="me"){ ui.me=t.getAttribute("data-pid"); saveUI(); render(); return; }
  if(a==="units"){ commit({t:"units",s:date,cid:cid,val:+t.getAttribute("data-val")}); return; }
  if(a==="inc"){ var c=getChore(cid),pdc=c.perDay||1; commit({t:"units",s:date,cid:cid,val:Math.min(pdc,Math.min(pdc,unitsOf(date,cid))+1)}); return; }
  if(a==="dec"){ var pdd=(getChore(cid).perDay||1); commit({t:"units",s:date,cid:cid,val:Math.max(0,Math.min(pdd,unitsOf(date,cid))-1)}); return; }
  if(a==="reps-inc"){ var ci=getChore(cid); commit({t:"edit",id:cid,patch:{perDay:Math.min(12,(ci.perDay||1)+1)}}); return; }
  if(a==="reps-dec"){ var cd=getChore(cid); commit({t:"edit",id:cid,patch:{perDay:Math.max(1,(cd.perDay||1)-1)}}); return; }
  if(a==="skip"){ commit({t:"skip",s:date,cid:cid,pid:t.getAttribute("data-pid"),on:true}); return; }
  if(a==="unskip"){ commit({t:"skip",s:date,cid:cid,on:false}); return; }
  if(a==="swap"){ commit({t:"assign",s:date,cid:cid,to:t.getAttribute("data-to")}); return; }
  if(a==="snooze"){ commit({t:"snooze",s:date,cid:cid}); return; }
  if(a==="reset-ov"){ commit({t:"reset-ov",s:todayStr()}); return; }
  if(a==="week"){ var dd=t.getAttribute("data-d"); ui.weekOffset=(dd==="0")?0:(ui.weekOffset+(+dd)); saveUI(); render(); return; }
  if(a==="anper"){ ui.anPeriod=+t.getAttribute("data-n"); saveUI(); render(); return; }
  if(a==="toggle-sec"){ var sec=t.getAttribute("data-sec"); ui[sec]=!ui[sec]; saveUI(); var disc=root.querySelector('[data-disc="'+sec+'"]'); if(disc)disc.classList.toggle("open",ui[sec]); return; }
  if(a==="mode"){ commit({t:"mode",mode:t.getAttribute("data-mode")}); return; }
  if(a==="pts"){ commit({t:"edit",id:cid,patch:{points:+t.getAttribute("data-val")}}); return; }
  if(a==="dow"){ var ch=getChore(cid),d2=(ch.freq.d||[]).slice(),dv=+t.getAttribute("data-d"),ix=d2.indexOf(dv); if(ix>=0)d2.splice(ix,1); else d2.push(dv); commit({t:"edit",id:cid,patch:{freq:{t:"dow",d:d2}}}); return; }
  if(a==="cyc"){ commit({t:"edit",id:cid,patch:{freq:{t:"everyN",n:+t.getAttribute("data-n"),anchor:(getChore(cid).freq.anchor||todayStr())}}}); return; }
  if(a==="del"){ if(t.classList.contains("arm")){ commit({t:"del",id:cid}); } else { t.classList.add("arm"); t.textContent="Точно?"; setTimeout(function(){ if(t){t.classList.remove("arm");t.textContent="Удалить";} },2600); } return; }
  if(a==="add"){ var inp=document.getElementById("newtitle"),v=(inp&&inp.value||"").trim(); if(!v)return; commit({t:"add",chore:{id:uid(),title:v,points:1,perDay:1,cat:"",why:"",freq:{t:"daily"}}}); return; }
  if(a==="help"){ showHelp(); return; }
});
root.addEventListener("change",function(e){
  var t=e.target.closest("[data-action]"); if(!t)return;
  var a=t.getAttribute("data-action"),cid=t.getAttribute("data-cid");
  if(a==="ftype"){ var v=t.value; if(v==="after"){ var oth=state.chores.filter(function(o){return o.id!==cid;}); commit({t:"edit",id:cid,patch:{freq:{t:"after"},after:{on:(oth[0]?oth[0].id:""),delayDays:0}}}); return; } var patch; if(v==="daily")patch={t:"daily"}; else if(v==="dow")patch={t:"dow",d:[]}; else if(v==="once")patch={t:"once",date:todayStr()}; else patch={t:"everyN",n:2,anchor:todayStr()}; commit({t:"edit",id:cid,patch:{freq:patch,after:null}}); return; }
  if(a==="depon"){ var dch=getChore(cid); commit({t:"edit",id:cid,patch:{after:{on:t.value,delayDays:(dch.after&&dch.after.delayDays)||0}}}); return; }
  if(a==="depdelay"){ var dc2=getChore(cid),ddv=Math.max(0,Math.min(30,Math.round(+t.value||0))); commit({t:"edit",id:cid,patch:{after:{on:(dc2.after&&dc2.after.on)||"",delayDays:ddv}}}); return; }
  if(a==="oncedate"){ commit({t:"edit",id:cid,patch:{freq:{t:"once",date:t.value||todayStr()}}}); return; }
  if(a==="cap"){ commit({t:"cap",p1:Math.max(0,Math.min(100,Math.round((+t.value||50)/5)*5))}); return; }
  if(a==="everyn"){ var n=Math.max(1,Math.min(365,+t.value||1)); commit({t:"edit",id:cid,patch:{freq:{t:"everyN",n:n,anchor:(getChore(cid).freq.anchor||todayStr())}}}); return; }
  if(a==="ptsnum"){ var pv=Math.max(0.5,Math.min(20,+t.value||1)); commit({t:"edit",id:cid,patch:{points:pv}}); return; }
  if(a==="perday"){ var pd=Math.max(1,Math.min(12,Math.round(+t.value||1))); commit({t:"edit",id:cid,patch:{perDay:pd}}); return; }
  if(a==="owner"){ commit({t:"edit",id:cid,patch:{owner:t.value||undefined}}); return; }
});
root.addEventListener("input",function(e){
  var t=e.target.closest('[data-action="cap"]'); if(!t)return;
  var v=Math.max(0,Math.min(100,+t.value||50)),row=t.closest(".caprow");
  if(row){ var l1=row.querySelector(".caplab.p1"),l2=row.querySelector(".caplab.p2"); if(l1)l1.textContent=getPerson("p1").name+" "+v+"%"; if(l2)l2.textContent=getPerson("p2").name+" "+(100-v)+"%"; }
});
root.addEventListener("focusout",function(e){
  var t=e.target.closest("[data-action]"); if(!t)return;
  var a=t.getAttribute("data-action"),cid=t.getAttribute("data-cid");
  if(a==="title"){ commit({t:"edit",id:cid,patch:{title:(t.value.trim()||getChore(cid).title)}}); return; }
  if(a==="why"){ commit({t:"edit",id:cid,patch:{why:t.value.trim()}}); return; }
  if(a==="cat"){ commit({t:"edit",id:cid,patch:{cat:t.value.trim()}}); return; }
  if(a==="rename"){ commit({t:"rename",pid:t.getAttribute("data-pid"),name:(t.value.trim()||getPerson(t.getAttribute("data-pid")).name)}); return; }
});
root.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  if(e.target.id==="newtitle"){ e.preventDefault(); var b=root.querySelector('[data-action="add"]'); if(b)b.click(); return; }
  var t=e.target.closest("[data-action]"); if(t){ var a=t.getAttribute("data-action"); if(a==="title"||a==="why"||a==="rename"||a==="cat"||a==="everyn"||a==="ptsnum"||a==="perday")t.blur(); }
});
window.addEventListener("scroll",function(){ if(scrollTimer)return; scrollTimer=setTimeout(function(){ scrollTimer=null; try{ sessionStorage.setItem(SCKEY,String(window.scrollY||window.pageYOffset||0)); }catch(e){} },250); },{passive:true});
window.addEventListener("pagehide",function(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; save(); } });

function uid(){ try{ if(crypto&&crypto.randomUUID)return "c_"+crypto.randomUUID().slice(0,8); }catch(e){} return "c_"+Math.floor((1+Math.random())*1e9).toString(36); }

function showHelp(){
  var m=document.getElementById("hcmodal"); if(m){ m.remove(); return; }
  m=document.createElement("div"); m.id="hcmodal";
  m.setAttribute("style","position:fixed;inset:0;background:rgba(8,30,36,.5);display:grid;place-items:center;z-index:50;padding:18px");
  m.innerHTML='<div class="glass" style="max-width:430px;padding:22px 24px;font-size:14.5px;line-height:1.5"><div style="font-family:var(--font-display);font-weight:600;font-size:19px;margin-bottom:10px;color:var(--ink)">Общий доступ вдвоём</div><div style="color:var(--muted)">Откройте эту страницу по одной и той же ссылке на обоих телефонах — данные синхронизируются автоматически через ваш Firebase.<br><br>На каждом устройстве вверху выберите «Это я» — так каждый видит свой список первым. Отметки, переносы и настройки сразу видны обоим.</div><div style="text-align:right;margin-top:16px"><button class="btn" data-action="help">Понятно</button></div></div>';
  m.addEventListener("click",function(ev){ if(ev.target===m)m.remove(); });
  document.body.appendChild(m);
}

/* ---------- sync (Firebase) / local fallback ---------- */
function configured(){ try{ return !!(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey.indexOf("ВСТАВЬ")<0); }catch(e){ return false; } }
function scheduleSave(){ setStatus("saving"); if(saveTimer)clearTimeout(saveTimer); saveTimer=setTimeout(save,450); }
function save(){
  saveTimer=null;
  if(fbReady&&fbRef){
    lastWritten=JSON.stringify(state);
    fbRef.set(state).then(function(){ setStatus(online?"saved":"offline"); }).catch(function(){ setStatus("error"); if(saveTimer)clearTimeout(saveTimer); saveTimer=setTimeout(save,1600); });
  } else {
    try{ localStorage.setItem(LSKEY,JSON.stringify(state)); }catch(e){}
    setStatus("local");
  }
}
function startLocal(){
  try{ var ls=localStorage.getItem(LSKEY); if(ls) state=normalize(JSON.parse(ls)); }catch(e){}
  render(); setStatus("local");
}
function init(){
  render();
  if(!configured()||typeof firebase==="undefined"){ startLocal(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    var db=firebase.database();
    fbRef=db.ref("rooms/"+ROOM_ID+"/state");
    db.ref(".info/connected").on("value",function(snap){ online=!!snap.val(); if(statusName!=="saving")setStatus(online?"saved":"offline"); });
    fbRef.on("value",function(snap){
      var v=snap.val(); fbReady=true;
      if(v==null){ lastWritten=JSON.stringify(state); fbRef.set(state); render(); setStatus(online?"saved":"offline"); return; }
      var j=JSON.stringify(v);
      if(j===lastWritten) return;
      state=normalize(v); render(); setStatus(online?"saved":"offline");
    },function(){ setStatus("error"); });
  }catch(e){ startLocal(); }
}
init();
})();
</script>
